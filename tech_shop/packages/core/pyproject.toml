[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-shop-core"
version = "0.1.0"
description = "Core business logic for Tech Shop - electronics store management"
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Laptev Pavel, Chuhnov Arseniy", email = "Laptevpavel2007@gmail.com"}
]
keywords = ["tech-shop", "business-logic", "electronics-store"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]