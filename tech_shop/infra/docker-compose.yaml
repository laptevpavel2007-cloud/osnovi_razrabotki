version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tech-shop:latest
    container_name: tech-shop-app
    restart: unless-stopped
    
    environment:
      - APP_ENV=production
      - DB_PATH=/app/data/store.db
      - DATA_DIR=/app/data
      - DISPLAY=${DISPLAY:-:0}

    volumes:
      - app_db:/app/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    
    network_mode: host

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_db:
    driver: local